name: Umbral Dominion - Stop Accidental Engine Build
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/umbral-dominion-stop-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  # EXACT previous engine concurrency group on develop; replaces and cancels it.
  group: Daily Builds and Tests-refs/heads/develop
  cancel-in-progress: true
jobs:
  stop-engine-and-confirm:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Stop obsolete multi-platform engine builds
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,per_page:100});
            const active=new Set(['queued','in_progress','waiting','pending','requested']);
            const obsolete=runs.filter(run=>run.name==='Daily Builds and Tests' &&
              run.head_branch==='develop' && active.has(run.status));
            let cancelled=0,failed=0;
            for(const run of obsolete){
              try{
                await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});
                core.info('Requested cancellation of unnecessary full-engine run #'+run.id);
                cancelled++;
              }catch(error){failed++;core.warning('Cancel request failed for '+run.id+': '+error.message);}
            }
            await core.summary.addHeading('VCMI engine CI cleanup')
              .addRaw('Old active full-engine runs found: '+obsolete.length+
                      '. Cancel requests: '+cancelled+'; errors: '+failed+
                      '. Main Umbral Dominion prototype build was left unchanged.')
              .write();
