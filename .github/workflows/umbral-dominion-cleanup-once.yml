name: One-time VCMI Actions queue cleanup and Umbral Dominion rebuild

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/umbral-dominion-cleanup-once.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: umbral-dominion-queue-cleanup
  cancel-in-progress: true

jobs:
  cancel-backlog-and-dispatch:
    name: Cancel obsolete runs, then dispatch only the corrected faction build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel all older queued/running runs in this fork
        id: cleanup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const self = context.runId;
            const activeStates = new Set(['queued', 'in_progress', 'pending', 'requested', 'waiting']);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, per_page: 100
            });
            let cancelled = 0, failed = 0;
            for (const run of runs) {
              if (run.id === self || !activeStates.has(run.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info('Requested cancellation: #'+run.id+' '+run.name+' ('+run.status+')');
                cancelled++;
              } catch (error) {
                core.warning('Could not cancel #'+run.id+': '+error.message);
                failed++;
              }
            }
            core.info('Cancellation requests: '+cancelled+'; errors: '+failed);
            core.setOutput('cancelled', cancelled);
            core.setOutput('failed', failed);
            await core.summary.addHeading('VCMI queued-run cleanup')
              .addRaw('Cancellation requests: '+cancelled+'; API errors: '+failed)
              .write();
      - name: Confirm older runs stop (best effort)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            for (let attempt = 0; attempt < 24; attempt++) {
              const items = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, per_page: 100
              });
              const remaining = items.filter(run =>
                run.id !== context.runId && ['queued','in_progress','pending','requested','waiting'].includes(run.status));
              if (remaining.length === 0) {core.info('All previous runs are stopped.');break;}
              core.info('Still stopping '+remaining.length+' older runs.');
              if (attempt === 23) {
                core.warning('Some runs still report active; proceeding to dispatch latest faction build.');
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
      - name: Dispatch exactly one latest Umbral Dominion build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'umbral-dominion-autobuild.yml',
              ref: 'develop',
              inputs: { strict_assets: 'false' }
            });
            core.info('Dispatched Umbral Dominion build on develop.');
            await core.summary.addHeading('Next step')
              .addRaw('Dispatched one latest Umbral Dominion build on develop; inspect its subsequent Actions run for results.')
              .write();
