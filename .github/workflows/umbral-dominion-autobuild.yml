name: Umbral Dominion - Auto Build (Windows mod draft)

on:
  push:
    branches: [develop]
    paths:
      - "umbral-dominion/design/**"
      - "umbral-dominion/scripts/**"
      - "umbral-dominion/assets/**"
      - "umbral-dominion/assets-source/**"
      - "umbral-dominion/qa/**"
      - ".github/workflows/umbral-dominion-autobuild.yml"
  schedule:
    # Backstop for API-token commits that do not emit Actions push events.
    # Weekly, not daily: minimizes CI runner usage.
    - cron: "17 3 * * 2"
  workflow_dispatch:
    inputs:
      strict_assets:
        description: "Fail if any required art asset is absent"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: umbral-dominion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    name: Generate JSON and development package
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout VCMI fork
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.20,<5" "json5>=0.9,<1" "pillow>=10,<13" "imageio-ffmpeg>=0.5,<1"
      # v0.5 art-intake source audit and pixel-accurate town-overlap review
      - name: Generate faction draft and validate against this fork
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.strict_assets || 'false' }}" == "true" ]]; then
            ARGS+=(--strict-assets)
          fi
          python umbral-dominion/scripts/build_mod.py \
            --schemas config/schemas \
            "${ARGS[@]}"
          python umbral-dominion/qa/verify_package.py umbral-dominion/build
          python umbral-dominion/qa/test_resource_resolution.py umbral-dominion/build
          python umbral-dominion/qa/test_sprite_pipeline.py umbral-dominion/build
          python umbral-dominion/qa/test_art_readiness.py umbral-dominion/build
          python umbral-dominion/qa/test_art_candidate_gate.py
          python umbral-dominion/qa/town_occlusion.py umbral-dominion/build
          python umbral-dominion/scripts/prepare_art_briefs.py
      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          if [[ -f umbral-dominion/build/BUILD_REPORT.md ]]; then
            cat umbral-dominion/build/BUILD_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Umbral Dominion generation failed; inspect build logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload development ZIP and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbral-dominion-windows-DRAFT
          path: |
            umbral-dominion/build/umbral-dominion-dev-DRAFT.zip
            umbral-dominion/build/BUILD_REPORT.md
            umbral-dominion/build/validation.json
            umbral-dominion/build/creature-audio-report.json
            umbral-dominion/build/resource-resolution.json
            umbral-dominion/build/missing-assets.json
            umbral-dominion/build/ASSET_PREVIEW.png
            umbral-dominion/build/ARTWORK_PREVIEW.png
            umbral-dominion/build/artwork-concepts.json
            umbral-dominion/build/SPRITE_ACTION_PREVIEW.png
            umbral-dominion/build/KEYPOSE_APPROVAL_SHEET.png
            umbral-dominion/build/DERIVED_POSE_REVIEW.png
            umbral-dominion/build/TOWN_STRUCTURE_REVIEW.png
            umbral-dominion/build/TOWN_LAYOUT_DIAGNOSTIC.png
            umbral-dominion/build/TOWN_LAYOUT_BEFORE_AFTER.png
            umbral-dominion/build/town-art-report.json
            umbral-dominion/build/ARTWORK_BACKLOG.json
            umbral-dominion/build/TOWN_OCCLUSION_AUDIT.json
            umbral-dominion/build/TOWN_OCCLUSION_REVIEW.md
            umbral-dominion/build/ART_GENERATION_BRIEFS.json
            umbral-dominion/build/art-briefs/*.json
            umbral-dominion/build/SPRITE_MOTION_PREVIEW.gif
            umbral-dominion/build/sprite-pose-report.json
          if-no-files-found: warn
          retention-days: 30

  windows-install-smoke:
    name: Windows ZIP and installer smoke test (no game data)
    needs: [generate-and-validate]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout installer script
        uses: actions/checkout@v4
      - name: Download verified alpha archive
        uses: actions/download-artifact@v4
        with:
          name: umbral-dominion-windows-DRAFT
          path: ${{ runner.temp }}/umbral-alpha-artifact
      - name: Dry-run install, asset check and upgrade backup
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'umbral-alpha-artifact/umbral-dominion-dev-DRAFT.zip'
          if (-not (Test-Path -LiteralPath $archive)) { throw 'Missing GitHub-built mod ZIP' }
          $dest = Join-Path $env:RUNNER_TEMP 'vcmi-alpha-sandbox'
          & './umbral-dominion/scripts/install_windows.ps1' -Archive $archive -VcmiDataDir $dest
          $mod = Join-Path $dest 'Mods/umbralDominion'
          foreach ($path in @('mod.json','Content/config/creatures.json',
             'Content/config/faction.json','Content/sprites/UD_VEILARCHER.json',
             'Content/sprites/UD_NIGHTSTALKER.json',
             'Content/sprites/UD_VOID_ARROW.json','Content/Music/UD_EBON_SPIRE.ogg',
             'Content/sounds/UD_ASHLING_ATTACK.wav','Content/sounds/UD_ECLIPSEDRAGON_KILLED.wav')) {
            if (-not (Test-Path -LiteralPath (Join-Path $mod $path))) {
              throw "Missing installed mod asset $path"
            }
          }
          $meta = Get-Content -LiteralPath (Join-Path $mod 'mod.json') -Raw | ConvertFrom-Json
          if ($meta.version -ne '0.5.0-alpha') { throw "Unexpected mod version: $($meta.version)" }
          $overlays = @(Get-ChildItem -LiteralPath (Join-Path $mod 'Content/sprites') -Filter 'UD_TOWN_*_FRAME0.png')
          if ($overlays.Count -lt 36) { throw "Expected 36 town overlay prototypes, found $($overlays.Count)" }
          & './umbral-dominion/scripts/install_windows.ps1' -Archive $archive -VcmiDataDir $dest
          $backups = @(Get-ChildItem -LiteralPath (Join-Path $dest 'Mods') -Directory |
             Where-Object { $_.Name -like 'umbralDominion-backup-*' })
          if ($backups.Count -ne 1) { throw "Installer backup smoke failed: $($backups.Count)" }
          & './umbral-dominion/qa/inspect_windows.ps1' -VcmiDataDir $dest -ReportDir (Join-Path $env:RUNNER_TEMP 'umbral-qa-evidence') -SkipGameDetection
          if ($LASTEXITCODE -ne 0) { throw 'Windows installed content audit failed' }
          'PASS: Windows ZIP extraction, mod layout, projectile, archive install and upgrade backup. GAMEPLAY NOT TESTED.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
