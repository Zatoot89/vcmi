name: Umbral Dominion - Artwork Candidate (manual / opt-in)
on:
  workflow_dispatch:
    inputs:
      creature_pair:
        description: Select a missing 2-creature source atlas
        type: choice
        options: [ashling-cinderimp, grave-doom-sentinels, hexbinder-soulweaver, dusk-abyssal-reavers, umbral-eclipse-dragons]
        default: ashling-cinderimp
        required: true
      generate_paid_candidate:
        description: Use paid Google image API (default OFF)
        type: boolean
        default: false
      acknowledge_provider_charges:
        description: Authorize ONE potentially billable image generation request
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: umbral-art-candidate
  cancel-in-progress: false
jobs:
  generate-art-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "pillow>=10,<13"
      - name: Validate candidate checks offline
        run: python umbral-dominion/qa/test_art_candidate_gate.py
      - name: Produce art brief or ONE explicitly authorized image
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAIR: ${{ inputs.creature_pair }}
          GENERATE: ${{ inputs.generate_paid_candidate }}
          AUTH: ${{ inputs.acknowledge_provider_charges }}
        run: |
          set -euo pipefail
          args=(--pair "$PAIR" --output "umbral-dominion/build/art-candidate")
          if [[ "$GENERATE" == "true" ]]; then
            if [[ "$AUTH" != "true" ]]; then
              echo "::error::Cost authorization is required to call the image provider"
              exit 1
            fi
            args+=(--generate --authorize-charges)
          fi
          python umbral-dominion/scripts/generate_art_candidates.py ${args[@]}
          echo "No generated artwork is automatically merged or released." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umbral-dominion-art-candidate-${{ github.run_number }}
          path: umbral-dominion/build/art-candidate/
          if-no-files-found: warn
          retention-days: 14
