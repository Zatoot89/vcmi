name: One-time cancel legacy full-engine VCMI runs

on:
  push:
    branches: [develop]
    paths: ['.github/workflows/umbral-dominion-cancel-legacy-once.yml']

permissions:
  contents: read

jobs:
  cancel-old-engine-run-groups:
    name: Cancel legacy engine run ${{ matrix.legacy_run_id }}
    strategy:
      fail-fast: false
      matrix:
        legacy_run_id: [41221626696, 41225569324, 41225633498, 41225741886, 41225834783, 41225941310, 41226388829, 41226450879, 41226574622, 41226751803]
    runs-on: ubuntu-latest
    concurrency:
      # Old github.yml scoped each push to its run ID, creating many independent
      # full-platform matrix builds. Collision cancels that old workflow run.
      group: Daily Builds and Tests-${{ matrix.legacy_run_id }}
      cancel-in-progress: true
    steps:
      - name: Record one-time legacy run cancellation
        run: echo "Requested GitHub concurrency cancellation for engine workflow run ${{ matrix.legacy_run_id }}"
